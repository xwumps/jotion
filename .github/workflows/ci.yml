name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Typecheck, Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jotion
          POSTGRES_PASSWORD: jotion
          # Tests leeren die Datenbank und laufen deshalb nur gegen *_test
          POSTGRES_DB: jotion_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jotion" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://jotion:jotion@localhost:5432/jotion_test
      REDIS_URL: redis://localhost:6379
      JOTION_PUBLIC_URL: http://localhost:8080
      # Nur Testwerte (32 Byte Base64), keine echten Secrets
      JOTION_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      AUTH_SECRET: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
      # Phase 8: echter CalDAV-Server für Connector-Tests
      JOTION_RADICALE_URL: http://127.0.0.1:5232
    steps:
      - uses: actions/checkout@v4
      - name: Radicale (CalDAV) starten
        run: |
          docker run -d --name radicale -p 5232:5232 \
            -v "$PWD/docker/radicale/config:/config/config:ro" \
            -v "$PWD/docker/radicale/users:/config/users:ro" \
            tomsquest/docker-radicale:3.5.4.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test --concurrency=1

  docker:
    name: Docker-Stack und E2E
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: bash scripts/init.sh
      # CI baut die Images aus diesem Stand, statt die veröffentlichten zu laden
      - run: sed -i -e 's|^JOTION_IMAGE_PREFIX=.*|JOTION_IMAGE_PREFIX=|' -e 's|^JOTION_VERSION=.*|JOTION_VERSION=local|' .env
      # Phase 8: der E2E-Test startet Radicale im Docker-Netz des Stacks
      - run: sed -i "s/^JOTION_SSRF_ALLOWLIST=.*/JOTION_SSRF_ALLOWLIST=radicale/" .env
      - name: Stack bauen und starten
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Healthchecks prüfen
        run: |
          docker compose ps
          curl -fsS http://localhost:8080/api/health/system
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          JOTION_E2E_DOCKER: '1'
      # Phase 12: Sicherung, Änderung, Wiederherstellung, Prüfung gegen den laufenden Stack
      - name: Backup-Restore-Roundtrip
        run: bash tests/ops/backup-roundtrip.sh
      # Phase 12: bekannte kritische Lücken mit verfügbarer Korrektur in den Images
      - name: Trivy (Images)
        run: |
          for img in jotion/api:local jotion/web:local jotion/worker:local jotion/backup:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
              image --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 --scanners vuln "$img"
          done
      # Phase 12: passiver Sicherheits-Scan der laufenden Anwendung (Bericht als Artefakt)
      - name: ZAP Baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -j'
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline
      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - run: docker compose down -v
        if: always()

  # Phase 12: Daten der Vorversion mit dem aktuellen Stand weiterverwenden (Migrationen vorwärts)
  upgrade:
    name: Upgrade von der Vorversion
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bash scripts/init.sh
      # CI baut die Images aus diesem Stand, statt die veröffentlichten zu laden
      - run: sed -i -e 's|^JOTION_IMAGE_PREFIX=.*|JOTION_IMAGE_PREFIX=|' -e 's|^JOTION_VERSION=.*|JOTION_VERSION=local|' .env
      - name: Upgrade-Test
        run: bash tests/ops/upgrade-test.sh "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}"
