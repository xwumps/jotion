# Release. Ein Tag v<Version> (z. B. v1.0.0) baut die Images für x86 (amd64) und ARM (arm64),
# veröffentlicht sie in der GitHub Container Registry und legt ein GitHub-Release mit dem
# passenden Abschnitt aus CHANGELOG.md an (oder ergänzt ein auf der Website angelegtes).
# Dazu kommt das Paket jotion-<Version>.tar.gz mit den Betriebsdateien für scripts/install.sh.
#
# Jede Architektur baut auf einem echten Rechner dieser Architektur (keine Emulation: unter QEMU
# stürzte pnpm für ARM ab und der Job hing). Ein bestehendes Release lässt sich unter
# Actions → Release → "Run workflow" mit dem Tag erneut bauen.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag eines bestehenden Releases, z. B. v1.0.1'
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Version prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: Tag, package.json und CHANGELOG stimmen überein
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag $TAG hat nicht die Form v1.2.3"; exit 1; }
          VERSION="${TAG#v}"
          for f in package.json apps/api/package.json apps/web/package.json apps/worker/package.json; do
            got="$(node -p "require('./$f').version")"
            [ "$got" = "$VERSION" ] || { echo "::error::$f hat Version $got, Tag ist $VERSION"; exit 1; }
          done
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md hat keinen Abschnitt [$VERSION]"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Image ${{ matrix.target }} (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [api, web, worker, backup]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bauen und hochladen (nur über den Digest, Tags folgen beim Zusammenführen)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.target }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
      - name: Digest merken
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  images:
    name: Image ${{ matrix.target }}
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        target: [api, web, worker, backup]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.target }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: x86 und ARM zu einem Image zusammenführen
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          IMAGE="${IMAGE,,}"
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE@$(cat digests/amd64)" "$IMAGE@$(cat digests/arm64)"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    name: GitHub-Release
    needs: [check, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Release mit Änderungen aus CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          # Auch für Releases, die auf der GitHub-Website angelegt wurden (Tag beim Veröffentlichen)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Jotion $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" --title "Jotion $VERSION" --notes-file notes.md --verify-tag
          fi
      - name: Betriebsdateien als Paket anhängen (für scripts/install.sh und update.sh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          tar -czf "jotion-$VERSION.tar.gz" compose.yml docker/Caddyfile docker/no-extra-ca.pem \
            .env.example CHANGELOG.md scripts/init.sh scripts/install.sh scripts/update.sh \
            scripts/backup.sh scripts/restore.sh
          tar -tzf "jotion-$VERSION.tar.gz"
          gh release upload "$TAG" "jotion-$VERSION.tar.gz" --clobber
