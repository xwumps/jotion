# Jotion Produktivbetrieb. Start: `bash scripts/init.sh && docker compose up -d --build`
name: jotion

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-jotion}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}@postgres:5432/${POSTGRES_DB:-jotion}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD fehlt}@redis:6379
  JOTION_PUBLIC_URL: ${JOTION_PUBLIC_URL:-http://localhost:8080}
  JOTION_DEFAULT_LOCALE: ${JOTION_DEFAULT_LOCALE:-de}
  JOTION_MASTER_KEY: ${JOTION_MASTER_KEY:?JOTION_MASTER_KEY fehlt}
  JOTION_MASTER_KEY_PREVIOUS: ${JOTION_MASTER_KEY_PREVIOUS:-}
  AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET fehlt}
  # Phase 3: Upload-Grenze (MB) und Freigaben für serverseitige Abrufe trotz privater Adresse
  JOTION_MAX_UPLOAD_MB: ${JOTION_MAX_UPLOAD_MB:-100}
  JOTION_SSRF_ALLOWLIST: ${JOTION_SSRF_ALLOWLIST:-}
  JOTION_TIMEZONE: ${JOTION_TIMEZONE:-Europe/Berlin}
  # Phase 11: OAuth-Apps für Google, Microsoft und Dropbox (leer = Anbieter nicht verfügbar)
  JOTION_GOOGLE_CLIENT_ID: ${JOTION_GOOGLE_CLIENT_ID:-}
  JOTION_GOOGLE_CLIENT_SECRET: ${JOTION_GOOGLE_CLIENT_SECRET:-}
  JOTION_MICROSOFT_CLIENT_ID: ${JOTION_MICROSOFT_CLIENT_ID:-}
  JOTION_MICROSOFT_CLIENT_SECRET: ${JOTION_MICROSOFT_CLIENT_SECRET:-}
  JOTION_MICROSOFT_TENANT: ${JOTION_MICROSOFT_TENANT:-common}
  JOTION_DROPBOX_CLIENT_ID: ${JOTION_DROPBOX_CLIENT_ID:-}
  JOTION_DROPBOX_CLIENT_SECRET: ${JOTION_DROPBOX_CLIENT_SECRET:-}
  # Phase 12: Prometheus-Metriken unter /api/metrics (leer = abgeschaltet)
  JOTION_METRICS_TOKEN: ${JOTION_METRICS_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jotion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-jotion}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Einmaliger Job: Datenbankmigrationen vor dem Start von api und worker
  migrate:
    init: true
    image: jotion/api:${JOTION_VERSION:-local}
    build: { context: ., dockerfile: docker/Dockerfile, target: api, secrets: [extra_ca] }
    restart: 'no'
    environment: *app-env
    command:
      [
        'node',
        'node_modules/@jotion/db/bin/prisma.cjs',
        'migrate',
        'deploy',
        '--schema',
        'node_modules/@jotion/db/prisma/schema.prisma',
      ]
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  api:
    init: true
    image: jotion/api:${JOTION_VERSION:-local}
    build: { context: ., dockerfile: docker/Dockerfile, target: api, secrets: [extra_ca] }
    restart: unless-stopped
    environment: *app-env
    volumes:
      - files_data:/data/files
      # Phase 12: Liste der Sicherungen und Anforderung aus dem Admin-Bereich
      - backups:/data/backups
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    init: true
    image: jotion/worker:${JOTION_VERSION:-local}
    build: { context: ., dockerfile: docker/Dockerfile, target: worker, secrets: [extra_ca] }
    restart: unless-stopped
    environment: *app-env
    volumes:
      - files_data:/data/files
      - backups:/data/backups
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Phase 12: Sicherungen (täglich und auf Anforderung) mit Werkzeugen aus dem Postgres-Image
  backup:
    image: jotion/backup:${JOTION_VERSION:-local}
    build: { context: ., dockerfile: docker/Dockerfile, target: backup, secrets: [extra_ca] }
    restart: unless-stopped
    init: true
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-jotion}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      PGDATABASE: ${POSTGRES_DB:-jotion}
      TZ: ${JOTION_TIMEZONE:-Europe/Berlin}
      JOTION_MASTER_KEY: ${JOTION_MASTER_KEY:?JOTION_MASTER_KEY fehlt}
      JOTION_MASTER_KEY_PREVIOUS: ${JOTION_MASTER_KEY_PREVIOUS:-}
      BACKUP_ENCRYPT: ${JOTION_BACKUP_ENCRYPT:-true}
      BACKUP_ENABLED: ${JOTION_BACKUP_ENABLED:-true}
      BACKUP_TIME: ${JOTION_BACKUP_TIME:-03:15}
      BACKUP_KEEP_DAILY: ${JOTION_BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${JOTION_BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_PRE_UPDATE: ${JOTION_BACKUP_KEEP_PRE_UPDATE:-3}
      BACKUP_KEEP_MANUAL: ${JOTION_BACKUP_KEEP_MANUAL:-5}
    volumes:
      - files_data:/data/files
      - backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h postgres -U "$${PGUSER}" -d "$${PGDATABASE}"']
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }

  web:
    init: true
    image: jotion/web:${JOTION_VERSION:-local}
    build: { context: ., dockerfile: docker/Dockerfile, target: web, secrets: [extra_ca] }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${JOTION_HTTP_PORT:-8080}:80'
      - '${JOTION_HTTPS_PORT:-8443}:443'
    environment:
      JOTION_SITE_ADDRESS: ${JOTION_SITE_ADDRESS:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/healthz >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }

secrets:
  # Optionales CA-Zertifikat für Builds hinter einem TLS-Proxy. Standard: leer.
  extra_ca:
    # Ohne eigene CA: leere Platzhalterdatei im Projekt. Dateien außerhalb des Projekts
    # (z. B. /dev/null) verlangt Docker Compose sonst als Extra-Freigabe (--allow=fs.read).
    file: ${JOTION_BUILD_CA:-./docker/no-extra-ca.pem}

volumes:
  pg_data:
  redis_data:
  files_data:
  backups:
  caddy_data:
